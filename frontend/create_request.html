<!DOCTYPE html>
<html>
<head>
    <title>Create Request</title>
    <link rel="stylesheet" href="css_styling/main.css">
    <link rel="stylesheet" href="css_styling/create_request.css">
</head>
<body>
    <div class="page-container">
        <div class="form-card">
            <h1>Create Facility Request</h1>

            <form id="requestForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="employeeName">Employee Name</label>
                        <input type="text" id="employeeName" placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label for="employeeId">Employee ID</label>
                        <input type="text" id="employeeId" placeholder="Enter your employee ID">
                    </div>
                </div>

                <label for="floor">Floor</label>
                <select id="floor">
                    <option value="">Select Floor</option>
                    <option>Floor 1</option>
                    <option>Floor 2</option>
                    <option>Floor 3</option>
                </select>

                <label for="pantry">Pantry Location</label>
                <select id="pantry">
                    <option value="">Select Pantry</option>
                    <option>Pantry A</option>
                    <option>Pantry B</option>
                    <option>Pantry C</option>
                </select>

                <label for="issueType">Issue Type</label>
                <select id="issueType">
                    <option value="">Select Issue</option>
                    <option>Tea/Coffee Refill</option>
                    <option>Milk Refill</option>
                    <option>Sugar Refill</option>
                    <option>Cup Shortage</option>
                    <option>Dishwash Liquid Refill</option>
                    <option>Cleaning Required</option>
                </select>

                <label for="description">Description</label>
                <textarea id="description" rows="4" placeholder="Describe the issue"></textarea>

                <button type="submit" class="submit-btn">Submit Request</button>
            </form>

            <a href="index.html" class="back-link">Back to Home</a>
        </div>
    </div>

    <script src="javascript/create_request.js"></script>
</body>
</html>
